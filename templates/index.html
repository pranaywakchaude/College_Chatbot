<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College ChatBot · Academic Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<!-- ── SIDEBAR ─────────────────────────────────────────────────────────── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">College ChatBot</span>
    </div>
    <button class="btn-new-chat" id="btnNewChat" title="New conversation">＋ New chat</button>
  </div>

  <div class="sidebar-section-label">Recent</div>
  <ul class="convo-list" id="convoList">
    <li class="convo-empty">No conversations yet</li>
  </ul>

  <div class="sidebar-footer">
    <div class="user-chip" id="userChip">
      <span class="user-avatar">?</span>
      <span class="user-name" id="userNameDisplay">Anonymous</span>
    </div>
    <button class="btn-rename" id="btnRename" title="Set display name">✎</button>
  </div>
</aside>

<!-- ── MOBILE TOGGLE ──────────────────────────────────────────────────── -->
<button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>

<!-- ── MAIN CHAT AREA ─────────────────────────────────────────────────── -->
<main class="chat-area">

  <!-- Welcome screen shown when no conversation is active -->
  <section class="welcome-screen" id="welcomeScreen">
    <div class="welcome-glyph">⬡</div>
    <h1 class="welcome-heading">College ChatBot</h1>
    <p class="welcome-sub">Your AI Academic Assistant · Answers with Definitions, Points &amp; Examples</p>
    <div class="welcome-chips">
      <button class="suggestion-chip" data-text="Explain the concept of Photosynthesis">Explain Photosynthesis ↗</button>
      <button class="suggestion-chip" data-text="What is Object Oriented Programming? Explain with types and characteristics">OOP Concepts &amp; Types ↗</button>
      <button class="suggestion-chip" data-text="Explain the French Revolution with causes, events and effects">French Revolution ↗</button>
      <button class="suggestion-chip" data-text="What are the types of Operating Systems? Explain with examples">Types of Operating Systems ↗</button>
    </div>
  </section>

  <!-- Chat messages -->
  <div class="messages-wrapper" id="messagesWrapper">
    <div class="messages" id="messages"></div>
  </div>

  <!-- Typing indicator -->
  <div class="typing-indicator hidden" id="typingIndicator">
    <span></span><span></span><span></span>
  </div>

  <!-- Input bar -->
  <div class="input-bar">
    <div class="input-container">
      <textarea
        id="userInput"
        class="message-input"
        placeholder="Ask anything…"
        rows="1"
        maxlength="4000"
        autofocus
      ></textarea>
      <button class="btn-send" id="btnSend" aria-label="Send message" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <p class="input-hint">Enter to send · Shift+Enter for newline · <span id="charCount">0</span>/4000</p>
  </div>

</main>

<!-- ── RENAME MODAL ──────────────────────────────────────────────────── -->
<div class="modal-overlay hidden" id="renameModal">
  <div class="modal">
    <h2 class="modal-title">Set your name</h2>
    <input type="text" id="nameInput" class="modal-input" placeholder="Your display name" maxlength="80" />
    <div class="modal-actions">
      <button class="btn-modal-cancel" id="btnModalCancel">Cancel</button>
      <button class="btn-modal-confirm" id="btnModalConfirm">Save</button>
    </div>
  </div>
</div>

<script src="/static/js/chat.js"></script>
</body>
</html>
